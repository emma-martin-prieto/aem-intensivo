<sly data-sly-use.clientlib="/libs/granite/sightly/templates/clientlib.html"
     data-sly-call="${clientlib.all @ categories='itv.site'}"/>

<footer class="footer-lp">
    <div class="footer-lp__container">
        
        <div class="footer-lp__row footer-lp__row--top">
            <div class="footer-lp__info">
                <h2 class="footer-lp__title">BuyCar</h2>  
                <div class="footer-lp__text-authorable">
                    <sly data-sly-resource="${'text' @ resourceType='core/wcm/components/text/v2/text'}"></sly>
                </div>
                <div class="footer-lp__contact">
                    <div class="footer-lp__contact-item">
                        <img src="/content/dam/itv/icon-location.png" alt="Loc">
                        <div class="footer-lp__contact-text">
                            <sly data-sly-resource="${'address' @ resourceType='core/wcm/components/text/v2/text'}"></sly>
                        </div>
                    </div>
                    <div class="footer-lp__contact-item">
                        <img src="/content/dam/itv/icon-email.png" alt="Email">
                        <div class="footer-lp__contact-text">
                            <sly data-sly-resource="${'email-contact' @ resourceType='core/wcm/components/text/v2/text'}"></sly>
                        </div>
                    </div>
                </div>
            </div>

            <div class="footer-lp__links">
                <h2 class="footer-lp__title">Links</h2>
                <nav class="footer-lp__nav">
                    <sly data-sly-resource="${'navigation-footer' @ resourceType='itv/components/navigation'}"></sly>
                </nav>
            </div>
        </div>
        
        <hr class="footer-lp__divider">

        <div class="footer-lp__bottom">
            <p class="footer-lp__copyright">${properties.copyrightText || '© 2023 PT Beli Mobil Duit Sendiri'}</p>
            <div class="footer-lp__social">
                <sly data-sly-use.socialNodes="${resource.path}/socialLinks">
                    <sly data-sly-list.item="${socialNodes.listChildren}">
                        <a href="${item.link}" class="footer-lp__social-link">
                            <img src="${item.iconPath}" alt="Social Icon">
                        </a>
                    </sly>
                </sly>
            </div>
        </div>
    </div>
</footer>
