<sly data-sly-use.clientlib="/libs/granite/sightly/templates/clientlib.html"
     data-sly-call="${clientlib.all @ categories='itv.site'}"/>

<div class="map-container" style="text-align: center; margin: 20px 0;">
    <h2 data-sly-test="${properties.mapUrl == null}">Configure la URL del mapa en el diálogo</h2>
    
    <iframe data-sly-test="${properties.mapUrl}" 
            src="${properties.mapUrl}" 
            width="100%" 
            height="480" 
            style="border:0; border-radius: 8px;" 
            allowfullscreen="" 
            loading="lazy">
    </iframe>
</div>
