<sly data-sly-use.clientlib="/libs/granite/sightly/templates/clientlib.html"
     data-sly-call="${clientlib.all @ categories='itv.site'}"></sly>

<section class="brands">
    <div class="brands__container">

        <div class="brands__header"
             data-aos="fade-up"
             data-aos-duration="900">
            <span class="brands__tag">${properties.tag || 'BMW Group Universe'}</span>
            <h2 class="brands__title">${properties.title || 'Más que una marca'}</h2>
            <p class="brands__intro">${properties.intro || 'Explora nuestras divisiones.'}</p>
        </div>

        <div class="brands__grid">
            <sly data-sly-list.item="${resource.children}">
                <sly data-sly-test="${item.name == 'brands'}">
                    <sly data-sly-list.brand="${item.children}">
                        <div class="brands__item"
                             data-sly-test="${brand.imagePath}"
                             data-aos="zoom-in"
                             data-aos-duration="900">
                            <a href="${brand.linkUrl}" 
                               class="brands__link" 
                               data-sly-unwrap="${!brand.linkUrl}">
                                <img src="${brand.imagePath}" alt="Logo BMW" class="brands__img"/>
                            </a>
                        </div>
                    </sly>
                </sly>
            </sly>
        </div>
    </div>
</section>

<sly data-sly-test="${wcmmode.edit && !properties.title}">
    <div style="padding: 20px; border: 1px dashed #1C69D4; text-align: center; color: #1C69D4;">
        Configurar Componente Marcas BMW
    </div>
</sly>
