<sly data-sly-use.clientlib="/libs/granite/sightly/templates/clientlib.html"
     data-sly-call="${clientlib.all @ categories='itv.bmw'}"/>

<sly data-sly-set.styleVal="${properties.style || 'default'}"></sly>
<sly data-sly-set.headerClass="${'style-{0}' @ format=[styleVal]}"></sly>

<section class="bmw-models-section ${headerClass}">
    <div class="bmw-models-section__header">
        
        <span class="bmw-models-section__tag"
              data-aos="fade-up"
              data-aos-duration="800">
            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
                <path d="M4 9a1 1 0 1 1-2 0 1 1 0 0 1 2 0m10 0a1 1 0 1 1-2 0 1 1 0 0 1 2 0"/>
                <path d="M6 1a1 1 0 0 0-.8.4L3.6 3.5H2a2 2 0 0 0-2 2V9a2 2 0 0 0 2 2h.17a3 3 0 0 0 5.66 0h.34a3 3 0 0 0 5.66 0H14a2 2 0 0 0 2-2V6.5a2 2 0 0 0-.59-1.41l-2.5-2.5A2 2 0 0 0 11.5 2H10.4l-.6-1.2A1 1 0 0 0 8.9.2h-2.9Zm.5 1h2.2l.5 1H6l.5-1Z"/>
            </svg>
            ${properties.tag || 'GAMA BMW'}
        </span>
        
        <h2 class="bmw-models-section__title"
            data-aos="fade-up"
            data-aos-duration="900"
            data-aos-delay="100">
            ${properties.title || 'Desde la Serie 1 hasta el M8'}
        </h2>
        
        <p class="bmw-models-section__intro"
           data-aos="fade-up"
           data-aos-duration="1000"
           data-aos-delay="200">
            ${properties.intro || 'Encuentra el modelo que mejor se adapta a tu forma de vivir.'}
        </p>
    </div>
</section>

<div data-sly-test="${wcmmode.edit && !properties.title}" class="cq-placeholder" data-emptytext="BMW Header: Configura el estilo y contenido"></div>
